<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes it look right on phones too -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book of Mormon - Top 10</title>
  <meta name="description" content="Book of Mormon Top 10 - Enter your favorite chapters">
  <meta name="author" content="Glycee Ann Bullecer Picar">
  <!-- My styles -->
  <link rel="stylesheet" href="styles/bom.css">
  <!-- My script, defer so HTML loads first -->
  <script src="scripts/bom.js" defer></script>
</head>
<body>
  <h1>📖 Book of Mormon - Top 10</h1>
  <main>
    <!-- Label for the input -->
    <label for="favchap">Enter Book and Chapter: </label>
    <!-- Where I type the chapter -->
    <input type="text" id="favchap" placeholder="Alma 5">
    <!-- Button to add it -->
    <button type="submit">Add Chapter</button>
    <!-- List where chapters will show up -->
    <ul id="list"></ul>
  </main>
</body>
</html>
