<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review - WDD 131</title>
  <meta name="description" content="Share your product review - rate a product, tell us which features you found useful, and submit your review.">
  <meta name="author" content="Glycee Ann Bullecer Picar">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form method="get" action="review.html">
      <!-- Product Name -->
      <label for="productName">Product Name *</label>
      <select id="productName" name="productName" required>
        <option value="" disabled selected>Select a Product...</option>
      </select>

      <!-- Overall Rating -->
      <fieldset>
        <legend>Overall Rating *</legend>
        <div class="stars">
          <label for="rating1">☆<br><input type="radio" id="rating1" name="rating" value="1" required></label>
          <label for="rating2">☆☆<br><input type="radio" id="rating2" name="rating" value="2" required></label>
          <label for="rating3">☆☆☆<br><input type="radio" id="rating3" name="rating" value="3" required></label>
          <label for="rating4">☆☆☆☆<br><input type="radio" id="rating4" name="rating" value="4" required></label>
          <label for="rating5">☆☆☆☆☆<br><input type="radio" id="rating5" name="rating" value="5" required></label>
        </div>
      </fieldset>

      <!-- Date of Installation -->
      <label for="installDate">Date of Installation *</label>
      <input type="date" id="installDate" name="installDate" required>

      <!-- Useful Features -->
      <fieldset>
        <legend>Which features did you find useful in the product? <span class="hint">(Check all that apply)</span></legend>
        <label><input type="checkbox" id="feature1" name="features" value="Durability"> Durability</label>
        <label><input type="checkbox" id="feature2" name="features" value="Ease of Use"> Ease of Use</label>
        <label><input type="checkbox" id="feature3" name="features" value="Performance"> Performance</label>
        <label><input type="checkbox" id="feature4" name="features" value="Design"> Design</label>
      </fieldset>

      <!-- Written Review -->
      <label for="writtenReview">Written Review <span class="hint">(Optional)</span></label>
      <textarea id="writtenReview" name="writtenReview" rows="5"></textarea>

      <!-- User Name -->
      <label for="userName">Your Name <span class="hint">(Optional)</span></label>
      <input type="text" id="userName" name="userName">

      <!-- Submit -->
      <input type="submit" value="Post Review">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> 🌸 Glycee Ann Bullecer Picar 🌸 Riyadh, Saudi Arabia</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
